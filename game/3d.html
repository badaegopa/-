<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>솔바람 대륙</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 원목 액자 안에 3D 대륙을 가득 채우고, 양피지 쪽지(HUD·메뉴)를 그 위에 얹는다. 단일 테마(원목) 고정. */
:root{
  color-scheme:dark;
  --wood-0:#1f150e; --wood-1:#2e2017; --wood-2:#47321f; --wood-3:#6b4a2e;
  --paper:#f2e4c4; --paper-2:#e6d3a9; --ink:#2b2118; --ink-soft:#6a5440;
  --leaf:#6fa85a; --gold:#e3b04b; --berry:#c8553f; --sea:#4d8fbf;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wood-0);color:var(--paper);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.stage{position:relative;height:100%;border:3px solid var(--wood-3);border-radius:10px;overflow:hidden;background:#9fd3f0}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:rgba(31,21,14,.78);border:1px solid var(--wood-3);border-radius:9px;padding:6px 12px;max-width:calc(100% - 170px)}
.hud h1{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;color:var(--gold)}
.hud .lbl{font-size:11px;letter-spacing:.08em;opacity:.7}
.hud .val{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums}
#mini{position:absolute;right:10px;top:10px;width:132px;height:132px;border:2px solid var(--wood-3);border-radius:8px;background:var(--wood-1)}
.menu{position:absolute;right:10px;top:152px;display:flex;flex-direction:column;gap:6px}
.btn{font-family:var(--f-display);font-size:14px;background:var(--wood-3);color:var(--paper);border:0;border-radius:7px;padding:6px 11px;cursor:pointer}
.btn:hover{background:var(--wood-2)}
.btn.alt{background:var(--leaf);color:#13230d}
.btn.warn{background:var(--berry)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.slot:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.menu .btn{background:rgba(31,21,14,.78);border:1px solid var(--wood-3);min-width:64px}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(31,21,14,.85);border:1px solid var(--gold);border-radius:8px;padding:6px 14px;font-family:var(--f-display);font-size:15px;cursor:pointer;white-space:nowrap}
#prog{position:absolute;left:50%;bottom:calc(22% - 16px);transform:translateX(-50%);width:160px;height:8px;background:rgba(31,21,14,.8);border-radius:5px;overflow:hidden}
#prog>i{display:block;height:100%;background:var(--gold);width:0}
#duelbar{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:rgba(31,21,14,.85);border:1px solid var(--berry);border-radius:9px;padding:8px 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-family:var(--f-display)}
.hp{height:10px;background:var(--wood-0);border-radius:5px;overflow:hidden}
.hp>i{display:block;height:100%;background:var(--leaf);transition:width .15s}
.hp.r>i{background:var(--berry);margin-left:auto}
#chatlog{position:absolute;left:10px;bottom:10px;width:min(320px,55%);display:flex;flex-direction:column;gap:3px;pointer-events:none;font-size:13px}
#chatlog div{background:rgba(31,21,14,.6);border-radius:6px;padding:2px 8px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
#toasts{position:absolute;left:50%;top:60px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(90%,420px)}
.toast{background:rgba(31,21,14,.92);border:1px solid var(--gold);padding:6px 12px;border-radius:8px;font-size:13.5px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.overlay{position:absolute;inset:0;background:rgba(15,10,6,.5);display:grid;place-items:center;padding:14px;z-index:5}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--wood-3);border-radius:12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--wood-2);color:var(--paper);position:sticky;top:0;z-index:1}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.sheet-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0;color:var(--wood-2)}
.card{background:#fbf3df;border:1px solid #d9c299;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.muted{color:var(--ink-soft);font-size:12.5px}
.story{font-size:15px;line-height:1.7;background:#fbf3df;border-left:4px solid var(--gold);padding:10px 12px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.slot{position:relative;aspect-ratio:1;max-width:100%;background:var(--paper-2);border:2px solid #cdb68a;border-radius:8px;font-size:24px;display:grid;place-items:center;cursor:pointer;padding:0}
.slot b{position:absolute;right:3px;bottom:1px;font-size:11px;font-family:var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.slot.sel{border-color:var(--berry);background:#f6d9b8}
.bar{height:7px;background:#dcc8a0;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf)}
.tag{font-size:11px;background:var(--wood-2);color:var(--paper);border-radius:10px;padding:1px 7px;white-space:nowrap}
.tag.g{background:var(--leaf);color:#13230d}.tag.y{background:var(--gold);color:var(--ink)}
input[type=text]{font-family:var(--f-body);font-size:14px;padding:6px 9px;border:2px solid #cdb68a;border-radius:7px;background:#fffaf0;color:var(--ink);min-width:0}
kbd{background:var(--paper-2);border:1px solid #c7ad7d;border-radius:4px;padding:0 5px;font-size:11.5px;font-family:var(--f-body)}
.pad{position:absolute;inset:auto 10px calc(12px + env(safe-area-inset-bottom,0px)) 10px;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(31,21,14,.45);border:2px solid rgba(242,228,196,.45);position:relative;pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(242,228,196,.6)}
.acts{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.rbtn{width:64px;height:64px;border-radius:50%;background:rgba(31,21,14,.6);border:2px solid rgba(242,228,196,.5);color:var(--paper);font-family:var(--f-display);font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.rbtn.big{width:76px;height:76px;font-size:18px}
@media (pointer:coarse){.pad{display:flex}#chatlog{bottom:150px}}
@media (max-width:560px){.hud h1{font-size:16px}.hud{max-width:calc(100% - 160px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app"><main class="stage" id="stage">
  <canvas id="cv" aria-label="솔바람 대륙 3D 화면"></canvas>
  <div class="hud">
    <h1>솔바람 대륙</h1>
    <span><span class="lbl">단계 </span><span class="val" id="hRank">새내기</span></span>

  <div id="duelbar" hidden><div><div id="dMe">나</div><div class="hp"><i id="dMeHp"></i></div></div><button class="btn warn" data-a="yield">기권</button><div style="text-align:right"><div id="dOp">상대</div><div class="hp r"><i id="dOpHp"></i></div></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="prompt" hidden></div>
  <div id="prog" hidden><i></i></div>
  <div id="chatlog"></div>
  <div class="pad">

</main></div>

function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=h2(xi,zi),b=h2(xi+1,zi),c=h2(xi,zi+1),d=h2(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,z){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,z*f);a*=.5;f*=2}return s/.9375}
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const WORLD=400;
function H(x,z){
  const r=Math.hypot(x,z);
  let h=fbm(x*.008+7,z*.008+3)*20-3.5;

  const fall=sm((r/WORLD-.74)/.24);h=h*(1-fall)-12*fall;
  const v=1-sm((r-46)/40);h=h*(1-v)+2.2*v;
  return h;
}
function zoneTier(x,z){const r=Math.hypot(x,z),h=H(x,z);if(z<-170&&h>14)return h>30?3:2;return r<150?1:r<285?2:3}
function terrainColor(x,z,h,out){

function oppPos(){if(!duel)return null;if(duel.opp==='npc')return npcs.gaon;return peers.get(duel.opp)||null}
function attack(){

  else emitDuel({k:'hit',to:duel.opp,d:Math.round(dmg)});
}
function takeHit(dmg){if(!duel)return;if(P.guard)dmg*=.3;duel.hp-=dmg;if(duel.hp<=0){if(duel.opp!=='npc')emitDuel({k:'end',to:duel.opp});endDuel(false)}}
function endDuel(won,quiet){

function updateDuel(dt){

function setNet(){const n=peers.size;$('#hNet').textContent=!room?'혼자 여행 중':n?`함께 ${n+1}명`:'여행자를 기다리는 중'}
async function initRoom(){

    [...ch.joined,...ch.updated].forEach(p=>{if(p.sameTab){myPeer=p.peer;return}if(p.kind!=='viewer')return;upPeer(p)});setNet()
  },()=>{room=null;[...peers.keys()].forEach(dropPeer);setNet()});

function upPeer(p){

function onDuelMsg(from,p,d){

function openSkills(){openModal('성장',()=>`<div class="story">${rank()} · 모든 단계의 합 ${totalLv()}</div>
  ${Object.keys(SK).map(k=>{const s=S.sk[k];return `<div class="card"><div class="row"><b class="grow">${SK[k].n} ${s.lv}단계</b>${s.lv>=10?'<span class="tag y">달인</span>':''}</div><div class="muted">${SK[k].d}</div>${s.lv<10?`<div class="bar"><i style="width:${s.xp/xpNeed(s.lv)*100}%"></i></div>`:''}</div>`}).join('')}
  <div class="card"><h3>여정의 단계</h3><div class="muted">① 마을 둘레(초록 들판): 잔나무·바위·약초 → ② 숲과 산기슭: 참나무(철 도끼)·철광맥(강화 곡괭이)·버섯(채집 2단계) → ③ 대륙 끝과 높은 산: 천년 고목(은 도끼)·은광맥(은 곡괭이)·별꽃(채집 4단계)</div></div>
  <div class="card"><h3>발자취</h3><div class="muted">채집·벌목·채굴 ${S.stat.gather}회 · 제작 ${S.stat.craft}회 · 수확 ${S.stat.harvest} · 대련 ${S.stat.wins}승/${S.stat.duels}전</div></div>
  <div class="row"><button class="btn" data-a="save">저장</button><button class="btn warn" data-a="reset">처음부터</button></div>`)}
/* ============ 입력 ============ */
const keys=new Set(),joyV={x:0,y:0};let resetArm=false;
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r','ㅈ':'u','ㄴ':'d','ㅁ':'l','ㅇ':'r'};
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input')){if(e.key==='Enter'){const b=e.target.parentElement.querySelector('button');if(b)b.click()}return}
  if(e.key==='Escape'){if(!$('#mClose').hidden)closeModal();return}if(modalOpen())return;
  if(KM[e.key]){keys.add(KM[e.key]);e.preventDefault()}
  if((e.key==='e'||e.key==='E'||e.key==='ㄷ'||e.key===' '||e.key==='f'||e.key==='F')&&!e.repeat){e.preventDefault();act()}
  if((e.key==='j'||e.key==='J'||e.key==='ㅓ')&&!e.repeat)attack();
  if(e.key==='k'||e.key==='K'||e.key==='ㅏ')P.guard=!!duel;
  if(e.key==='Enter')openSocial();
});
addEventListener('keyup',e=>{if(KM[e.key])keys.delete(KM[e.key]);if(e.key==='k'||e.key==='K'||e.key==='ㅏ')P.guard=false});
addEventListener('blur',()=>{keys.clear();P.guard=false});
(function(){const cv=$('#cv');let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;camYaw-=(e.clientX-drag.x)*.006;camPitch=clamp(camPitch+(e.clientY-drag.y)*.004,.12,1.25);drag.x=e.clientX;drag.y=e.clientY});
  const up=e=>{if(drag&&drag.id===e.pointerId)drag=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();camDist=clamp(camDist+e.deltaY*.02,7,60)},{passive:false});
  const joy=$('#joy'),k=$('#joyK');let jid=null;
  const mv=e=>{const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-60)/50,y=(e.clientY-r.top-60)/50;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joyV.x=x;joyV.y=y;k.style.transform=`translate(${x*36}px,${y*36}px)`};
  joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(jid);mv(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)mv(e)});
  const ju=e=>{if(e.pointerId===jid){jid=null;joyV.x=joyV.y=0;k.style.transform=''}};joy.addEventListener('pointerup',ju);joy.addEventListener('pointercancel',ju);
  $('#bAct').addEventListener('pointerdown',e=>{e.preventDefault();act()});
  $('#bAtk').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
  const g=$('#bGrd');g.addEventListener('pointerdown',e=>{e.preventDefault();P.guard=!!duel});g.addEventListener('pointerup',()=>P.guard=false);g.addEventListener('pointercancel',()=>P.guard=false);
  $('#prompt').addEventListener('click',act);
})();
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v,k=el.dataset.k;
  switch(a){
    case 'close':closeModal();break;
    case 'bag':openBag();break;case 'craft':openCraft();break;case 'skills':openSkills();break;case 'social':openSocial();break;
    case 'recall':if(duel)break;P.x=0;P.z=8;toast('마을 우물가로 돌아왔다.');break;
    case 'sel':sel=sel===v?null:v;rer();break;
    case 'seed':S.seed=S.seed===v?null:v;rer();break;
    case 'make':make(v);break;
    case 'upgrade':{const nx=HOUSE[S.house+1];if(!nx||!canPay(nx.need)||S.coin<nx.coin)break;pay(nx.need);S.coin-=nx.coin;S.house++;buildHouse();buildPlots();addXP('craft',80);toast(`${nx.n} 완성! 밭이 ${nx.plots}칸이 되었다.`);hud();rer();break}
    case 'shop':openShop();break;
    case 'shoptab':shopTab=v;rer();break;
    case 'sell':{const n=el.dataset.n==='all'?S.inv[v]||0:1;if(!take(v,n))break;S.coin+=IT[v].p*n;addXP('social',1);toast(`${IT[v].n} ${n}개 → ${IT[v].p*n}전`);hud();rer();break}
    case 'buy':{const n=+el.dataset.n,g=IT[v].p*3*n;if(S.coin<g)break;S.coin-=g;give(v,n);toast(`${IT[v].n} ${n}개를 샀다.`);hud();rer();break}
    case 'deliver':{const f=S.fr[v],q=f.q;if(!q||!take(q.item,q.qty))break;const rw=IT[q.item].p*q.qty*2+20;S.coin+=rw;toast(`${NPC[v].n}의 부탁을 들어주었다. +${rw}전`);newQuest(v);heart(v,1);hud();closeModal();if(!modalOpen())talk(v);break}
    case 'gift':{if(!take(k))break;S.fr[v].gift=Date.now()+10*60*1000;toast(`${NPC[v].n}에게 ${IT[k].n}을(를) 건넸다.`);heart(v,1);closeModal();if(!modalOpen())talk(v);break}
    case 'sparnpc':startDuel('npc','가온 사범');break;
    case 'yield':if(duel){if(duel.opp!=='npc')emitDuel({k:'yield',to:duel.opp});endDuel(false)}break;
    case 'reqduel':{const p=peers.get(v);if(!p||duel)break;if(Math.hypot(p.x-P.x,p.z-P.z)>12){toast('조금 더 가까이 가서 청하자.');break}pendingReq=v;emitDuel({k:'req',to:v});toast(`${p.nick}에게 대련을 청했다.`);$('#modal').hidden=true;break}
    case 'accduel':{const p=peers.get(pendingReq);const from=pendingReq;pendingReq=null;$('#mClose').hidden=false;closeModal();if(p){emitDuel({k:'acc',to:from});startDuel(from,p.nick)}break}
    case 'decduel':{if(pendingReq)emitDuel({k:'dec',to:pendingReq});pendingReq=null;$('#mClose').hidden=false;closeModal();break}
    case 'wave':P.swing=.6;swN++;sendChat('안녕하세요! 👋');closeModal();break;
    case 'nick':{const t=($('#nickIn').value||'').trim().slice(0,12);S.nick=t;S.seen=true;toast(t?`이제 ${t}(이)라 불린다.`:'이름을 비웠다.');save();if($('#mClose').hidden){$('#mClose').hidden=false;closeModal()}else rer();break}
    case 'color':S.col=+v;scene.remove(me);me=makeAvatar(COLORS[S.col],0xd8b25a);scene.add(me);rer();break;
    case 'chat':{const i=$('#chatIn');sendChat(i.value);i.value='';break}
    case 'save':save();toast('저장했다.');break;
    case 'reset':if(!resetArm){resetArm=true;el.textContent='한 번 더 누르면 초기화';setTimeout(()=>resetArm=false,3000);break}try{localStorage.removeItem('solbaram3d-v1')}catch(e){}location.reload();break;
  }
});
/* ============ 지도 ============ */
let miniBase=null;
function buildMini(){const c=document.createElement('canvas');c.width=c.height=132;const x=c.getContext('2d'),im=x.createImageData(132,132),col=[0,0,0];
  for(let j=0;j<132;j++)for(let i=0;i<132;i++){const wx=(i/131*2-1)*WORLD,wz=(j/131*2-1)*WORLD,h=H(wx,wz),o=(j*132+i)*4;if(h<0){im.data[o]=60;im.data[o+1]=120;im.data[o+2]=165}else{terrainColor(wx,wz,h,col);im.data[o]=col[0]*255;im.data[o+1]=col[1]*255;im.data[o+2]=col[2]*255}im.data[o+3]=255}
  x.putImageData(im,0,0);miniBase=c}
function drawMini(){const x=$('#mini').getContext('2d');x.drawImage(miniBase,0,0);const m=(wx,wz)=>[(wx/WORLD+1)/2*131,(wz/WORLD+1)/2*131];
  x.fillStyle='#e3b04b';let p=m(0,0);x.fillRect(p[0]-2,p[1]-2,5,5);
  peers.forEach(o=>{p=m(o.x,o.z);x.fillStyle='#fff';x.beginPath();x.arc(p[0],p[1],2.5,0,7);x.fill()});
  p=m(P.x,P.z);x.fillStyle='#c8553f';x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.arc(p[0],p[1],3.5,0,7);x.fill();x.stroke();
  x.strokeStyle='#fff';x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]-Math.sin(camYaw)*8,p[1]-Math.cos(camYaw)*8);x.stroke()}
/* ============ 하늘 ============ */
const SKY=[[0,0x24386b],[.18,0x24386b],[.25,0xf0a36b],[.32,0x9fd3f0],[.74,0x9fd3f0],[.81,0xf08a5b],[.88,0x24386b],[1,0x24386b]];
const _c1=new THREE.Color(),_c2=new THREE.Color();
function sky(){const t=(Date.now()/1000%720)/720;let i=0;while(SKY[i+1][0]<t)i++;const f=(t-SKY[i][0])/(SKY[i+1][0]-SKY[i][0]);_c1.setHex(SKY[i][1]);_c2.setHex(SKY[i+1][1]);_c1.lerp(_c2,f);
  scene.background.copy(_c1);scene.fog.color.copy(_c1);const day=clamp(Math.sin((t-.25)*Math.PI*2)*1.6+.5,0,1);sun.intensity=.2+.4*day;hemi.intensity=.82-.22*day;hemi.color.setHex(0x8fa6e0).lerp(_c2.setHex(0xdff2ff),day);stars.material.opacity=1-day;
  sun.position.set(Math.cos((t-.25)*6.283)*200,Math.sin((t-.25)*6.283)*200+40,80);
  $('#hSky').textContent=t<.2?'깊은 밤':t<.3?'새벽':t<.45?'아침':t<.62?'한낮':t<.74?'오후':t<.84?'노을':'밤'}
/* ============ 루프 ============ */
let last=0,acc1=0,accP=0,accM=0,T=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;
  // 이동
  let ix=(keys.has('r')?1:0)-(keys.has('l')?1:0)+joyV.x,iz=(keys.has('u')?1:0)-(keys.has('d')?1:0)-joyV.y;const il=Math.hypot(ix,iz);
  P.moving=false;
  if(il>.15&&!modalOpen()){if(gather){gather=null;$('#prog').hidden=true}
    if(il>1){ix/=il;iz/=il}const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
    const mx=fx*iz+rx*ix,mz=fz*iz+rz*ix,sp=(P.guard?4:11)*dt;const nx=clamp(P.x+mx*sp,-WORLD+5,WORLD-5),nz=clamp(P.z+mz*sp,-WORLD+5,WORLD-5);
    if(H(nx,nz)>-.7){P.x=nx;P.z=nz}else if(H(nx,P.z)>-.7)P.x=nx;else if(H(P.x,nz)>-.7)P.z=nz;
    P.yaw=Math.atan2(mx,mz);P.moving=true}
  P.y=Math.max(H(P.x,P.z),-.5);P.swing=Math.max(0,P.swing-dt);
  if(gather){gather.t+=dt;P.swing=.3;$('#prog').firstElementChild.style.width=Math.min(100,gather.t/gather.dur*100)+'%';if(gather.t>=gather.dur)finishGather()}
  updateDuel(dt);
  me.position.set(P.x,P.y,P.z);me.rotation.y=P.yaw;animAvatar(me,P.moving,T,P.swing,P.guard);
  // 주민·여행자
  for(const id in npcs){const n=npcs[id];n.swing=Math.max(0,n.swing-dt);n.av.position.set(n.x,H(n.x,n.z),n.z);if(!(duel&&duel.opp==='npc'&&id==='gaon')){const d=Math.hypot(P.x-n.x,P.z-n.z);if(d<9)n.av.rotation.y=Math.atan2(P.x-n.x,P.z-n.z)}animAvatar(n.av,n.moving,T,n.swing,n.guard)}
  peers.forEach(o=>{if(o.tx!==undefined){const k=Math.min(1,dt*10);o.x+=(o.tx-o.x)*k;o.z+=(o.tz-o.z)*k;let dr=o.tr-o.av.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));o.av.rotation.y+=dr*k}o.swing=Math.max(0,o.swing-dt);o.av.position.set(o.x,Math.max(H(o.x,o.z),-.5),o.z);animAvatar(o.av,o.mv,T,o.swing,o.guard)});
  // 카메라
  const cp=Math.cos(camPitch),cxp=P.x+Math.sin(camYaw)*cp*camDist,czp=P.z+Math.cos(camYaw)*cp*camDist;let cy=P.y+2+Math.sin(camPitch)*camDist;cy=Math.max(cy,H(cxp,czp)+1.5,1);
  camera.position.set(cxp,cy,czp);camera.lookAt(P.x,P.y+2.2,P.z);stars.position.copy(camera.position);
  // 주기 작업
  acc1+=dt;if(acc1>1){acc1=0;const n=Date.now();for(const nd of nodes)if(!nd.alive&&n>nd.resp){nd.alive=true;setInst(nd,true)}refreshPlots();sky()}
  accP+=dt;if(accP>.12){accP=0;sendPresence();findTarget()}
  accM+=dt;if(accM>.3){accM=0;drawMini()}
  if(!modalOpen()&&!duel&&mq.length)mq.shift()();
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
/* ============ 시작 ============ */
function start(){
  if(typeof THREE==='undefined'){document.body.insertAdjacentHTML('beforeend','<div class="overlay"><div class="sheet"><div class="sheet-body">3D 엔진을 불러오지 못했다. 네트워크 연결을 확인한 뒤 다시 열어 보자.</div></div></div>');return}
  const fresh=!load();if(fresh)S=newState();P.x=S.x;P.z=S.z;
  try{initScene()}catch(e){$('#stage').insertAdjacentHTML('beforeend','<div class="overlay"><div class="sheet"><div class="sheet-body">이 브라우저에서는 3D(WebGL)를 켤 수 없다. 크롬·엣지 최신 버전에서 열어 보자.</div></div></div>');return}
  buildNodes();buildVillage();buildMini();resize();new ResizeObserver(resize).observe($('#stage'));sky();hud();
  requestAnimationFrame(t=>{last=t;frame(t)});initRoom();setInterval(save,20000);
  if(!S.seen)openModal('솔바람 대륙에 오신 것을 환영합니다',()=>`<div class="story">바람과 솔향이 흐르는 넓은 대륙. 서두를 일도, 잃을 것도 없다. 걷고, 줍고, 가꾸고, 만들며 천천히 자라면 된다.</div>
    <div class="card"><h3>이름을 알려 주세요</h3><div class="row"><input type="text" id="nickIn" maxlength="12" placeholder="이름 (12자)" class="grow"><button class="btn alt" data-a="nick">여행 시작</button></div></div>
    <div class="card"><h3>할 수 있는 일</h3><div>• <b>채집·벌목·채굴</b> — 가까이 가서 <kbd>E</kbd>. 더 좋은 도구를 만들면 더 먼 땅이 열린다</div><div>• <b>경작</b> — 집 옆 밭에 씨앗을 심으면 다른 일을 하는 동안에도 자란다</div><div>• <b>제작</b> — 작업대에서 도구·가구, 집 화덕에서 음식</div><div>• <b>교류</b> — 주민의 부탁을 들어주고 선물하며 정을 쌓는다. 이 페이지를 함께 연 사람과는 같은 대륙에서 만난다</div><div>• <b>대련</b> — 가온 사범이나 다른 여행자와. 서로 다치지 않고 잃는 것도 없다</div></div>
    <div class="muted">이동 <kbd>WASD</kbd>/<kbd>방향키</kbd> · 시점 화면 끌기 · 확대 휠 · 행동 <kbd>E</kbd> · 공격 <kbd>J</kbd> · 방어 <kbd>K</kbd> · 모바일은 왼쪽 조이스틱과 오른쪽 버튼</div>`,true);
}
start();
</script>
