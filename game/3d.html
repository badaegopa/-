<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>솔바람 대륙</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 원목 액자 안에 3D 대륙을 가득 채우고, 양피지 쪽지(HUD·메뉴)를 그 위에 얹는다. 단일 테마(원목) 고정. */
:root{
  color-scheme:dark;
  --wood-0:#1f150e; --wood-1:#2e2017; --wood-2:#47321f; --wood-3:#6b4a2e;
  --paper:#f2e4c4; --paper-2:#e6d3a9; --ink:#2b2118; --ink-soft:#6a5440;
  --leaf:#6fa85a; --gold:#e3b04b; --berry:#c8553f; --sea:#4d8fbf;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wood-0);color:var(--paper);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.stage{position:relative;height:100%;border:3px solid var(--wood-3);border-radius:10px;overflow:hidden;background:#9fd3f0}
#cv{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:rgba(31,21,14,.78);border:1px solid var(--wood-3);border-radius:9px;padding:6px 12px;max-width:calc(100% - 170px)}
.hud h1{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;color:var(--gold)}
.hud .lbl{font-size:11px;letter-spacing:.08em;opacity:.7}
.hud .val{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums}
#mini{position:absolute;right:10px;top:10px;width:132px;height:132px;border:2px solid var(--wood-3);border-radius:8px;background:var(--wood-1)}
.menu{position:absolute;right:10px;top:152px;display:flex;flex-direction:column;gap:6px}
.btn{font-family:var(--f-display);font-size:14px;background:var(--wood-3);color:var(--paper);border:0;border-radius:7px;padding:6px 11px;cursor:pointer}
.btn:hover{background:var(--wood-2)}
.btn.alt{background:var(--leaf);color:#13230d}
.btn.warn{background:var(--berry)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.slot:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.menu .btn{background:rgba(31,21,14,.78);border:1px solid var(--wood-3);min-width:64px}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(31,21,14,.85);border:1px solid var(--gold);border-radius:8px;padding:6px 14px;font-family:var(--f-display);font-size:15px;cursor:pointer;white-space:nowrap}
#prog{position:absolute;left:50%;bottom:calc(22% - 16px);transform:translateX(-50%);width:160px;height:8px;background:rgba(31,21,14,.8);border-radius:5px;overflow:hidden}
#prog>i{display:block;height:100%;background:var(--gold);width:0}
#duelbar{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:rgba(31,21,14,.85);border:1px solid var(--berry);border-radius:9px;padding:8px 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-family:var(--f-display)}
.hp{height:10px;background:var(--wood-0);border-radius:5px;overflow:hidden}
.hp>i{display:block;height:100%;background:var(--leaf);transition:width .15s}
.hp.r>i{background:var(--berry);margin-left:auto}
#chatlog{position:absolute;left:10px;bottom:10px;width:min(320px,55%);display:flex;flex-direction:column;gap:3px;pointer-events:none;font-size:13px}
#chatlog div{background:rgba(31,21,14,.6);border-radius:6px;padding:2px 8px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
#toasts{position:absolute;left:50%;top:60px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(90%,420px)}
.toast{background:rgba(31,21,14,.92);border:1px solid var(--gold);padding:6px 12px;border-radius:8px;font-size:13.5px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.overlay{position:absolute;inset:0;background:rgba(15,10,6,.5);display:grid;place-items:center;padding:14px;z-index:5}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--wood-3);border-radius:12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--wood-2);color:var(--paper);position:sticky;top:0;z-index:1}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.sheet-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0;color:var(--wood-2)}
.card{background:#fbf3df;border:1px solid #d9c299;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.muted{color:var(--ink-soft);font-size:12.5px}
.story{font-size:15px;line-height:1.7;background:#fbf3df;border-left:4px solid var(--gold);padding:10px 12px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.slot{position:relative;aspect-ratio:1;max-width:100%;background:var(--paper-2);border:2px solid #cdb68a;border-radius:8px;font-size:24px;display:grid;place-items:center;cursor:pointer;padding:0}
.slot b{position:absolute;right:3px;bottom:1px;font-size:11px;font-family:var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.slot.sel{border-color:var(--berry);background:#f6d9b8}
.bar{height:7px;background:#dcc8a0;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf)}
.tag{font-size:11px;background:var(--wood-2);color:var(--paper);border-radius:10px;padding:1px 7px;white-space:nowrap}
.tag.g{background:var(--leaf);color:#13230d}.tag.y{background:var(--gold);color:var(--ink)}
input[type=text]{font-family:var(--f-body);font-size:14px;padding:6px 9px;border:2px solid #cdb68a;border-radius:7px;background:#fffaf0;color:var(--ink);min-width:0}
kbd{background:var(--paper-2);border:1px solid #c7ad7d;border-radius:4px;padding:0 5px;font-size:11.5px;font-family:var(--f-body)}
.pad{position:absolute;inset:auto 10px calc(12px + env(safe-area-inset-bottom,0px)) 10px;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(31,21,14,.45);border:2px solid rgba(242,228,196,.45);position:relative;pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(242,228,196,.6)}
.acts{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.rbtn{width:64px;height:64px;border-radius:50%;background:rgba(31,21,14,.6);border:2px solid rgba(242,228,196,.5);color:var(--paper);font-family:var(--f-display);font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.rbtn.big{width:76px;height:76px;font-size:18px}
@media (pointer:coarse){.pad{display:flex}#chatlog{bottom:150px}}
@media (max-width:560px){.hud h1{font-size:16px}.hud{max-width:calc(100% - 160px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app"><main class="stage" id="stage">
  <canvas id="cv" tabindex="0" aria-label="솔바람 대륙 3D 화면"></canvas>
  <div class="hud">
    <h1>솔바람 대륙</h1>
    <span><span class="lbl">단계 </span><span class="val" id="hRank">새내기</span></span>

    <button class="btn" data-a="recall">귀환</button>
  </div>
  <div id="duelbar" hidden><div><div id="dMe">나</div><div class="hp"><i id="dMeHp"></i></div></div><button class="btn warn" data-a="yield">기권</button><div style="text-align:right"><div id="dOp">상대</div><div class="hp r"><i id="dOpHp"></i></div></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="prompt" hidden></div>
  <div id="prog" hidden><i></i></div>
  <div id="chatlog"></div>
  <div class="pad">
    <div id="joy"><i id="joyK"></i></div>
    <div class="acts"><button class="rbtn" id="bGrd" hidden>방어</button><button class="rbtn" id="bAtk" hidden>공격</button><button class="rbtn big" id="bAct">행동</button></div>

</main></div>

/* ============ 지형 ============ */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=h2(xi,zi),b=h2(xi+1,zi),c=h2(xi,zi+1),d=h2(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,z){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,z*f);a*=.5;f*=2}return s/.9375}
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const WORLD=400;
function H(x,z){
  const r=Math.hypot(x,z);
  let h=fbm(x*.008+7,z*.008+3)*20-3.5;
  const mt=sm((-z-140)/160);h+=mt*(fbm(x*.014+50,z*.014)*46+8);

  const fall=sm((r/WORLD-.74)/.24);h=h*(1-fall)-12*fall;
  const v=1-sm((r-46)/40);h=h*(1-v)+2.2*v;
  return h;
}
function zoneTier(x,z){const r=Math.hypot(x,z),h=H(x,z);if(z<-170&&h>14)return h>30?3:2;return r<150?1:r<285?2:3}
function slopeAt(x,z){return Math.hypot(H(x+1.5,z)-H(x-1.5,z),H(x,z+1.5)-H(x,z-1.5))/3}

    <div class="card"><h3>이름을 알려 주세요</h3><div class="row"><input type="text" id="nickIn" maxlength="12" placeholder="이름 (12자)" class="grow"><button class="btn alt" data-a="nick">여행 시작</button></div></div>
    <div class="card"><h3>할 수 있는 일</h3><div>• <b>채집·벌목·채굴</b> — 가까이 가서 <kbd>E</kbd>. 더 좋은 도구를 만들면 더 먼 땅이 열린다</div><div>• <b>경작</b> — 집 옆 밭에 씨앗을 심으면 다른 일을 하는 동안에도 자란다</div><div>• <b>제작</b> — 작업대에서 도구·가구, 집 화덕에서 음식</div><div>• <b>교류</b> — 주민의 부탁을 들어주고 선물하며 정을 쌓는다. 이 페이지를 함께 연 사람과는 같은 대륙에서 만난다</div><div>• <b>대련</b> — 가온 사범이나 다른 여행자와. 서로 다치지 않고 잃는 것도 없다</div></div>

}
start();
